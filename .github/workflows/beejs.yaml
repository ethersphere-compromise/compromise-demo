name: bee-js

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install @ethersphere/bee-js
        run: |
          mkdir -p app && cd app
          npm init -y
          npm install @ethersphere/bee-js
          cat > run.js <<'EOF'
          const { Bee } = require('@ethersphere/bee-js');
          const pkg = require('@ethersphere/bee-js/package.json');
          const bee = new Bee('http://localhost:1633');
          console.log(`bee-js ${pkg.version} loaded, client points at ${bee.url}`);
          EOF

      - name: Upload package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bee-js-package
          path: app
          include-hidden-files: true
          if-no-files-found: error

  run:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: bee-js-package
          path: app

      - name: Run the package
        working-directory: app
        run: node run.js
